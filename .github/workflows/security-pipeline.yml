name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: SAST com Bandit
        run: bandit -r app -f json -o bandit-report.json
        continue-on-error: true

      - name: Análise de dependências com pip-audit
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json
        continue-on-error: true

      - name: Testes automatizados
        run: pytest

      - name: Security gate - bloquear em achado Alto ou Crítico
        run: |
          python scripts/security_gate.py bandit-report.json

      - name: Publicar relatórios como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json